name: Release apps
# Runs when a release branch is pushed (release/vX.Y.Z), tag (v*), or manually.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller and dependencies
        run: pip install pyinstaller pywebview pillow
      - name: Build app
        run: pyinstaller packaging/voiceforge.spec --noconfirm
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/VoiceForge.exe -DestinationPath VoiceForge-Windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qr ../VoiceForge-macOS.zip VoiceForge.app
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../VoiceForge-Linux.tar.gz VoiceForge
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            VoiceForge-Windows.zip
            VoiceForge-macOS.zip
            VoiceForge-Linux.tar.gz
          if-no-files-found: ignore
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Stage Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VoiceForge-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: VoiceForge-Android.apk
  ios:
    name: iOS app (unsigned, simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project VoiceForge.xcodeproj -scheme VoiceForge \
            -sdk iphonesimulator -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator
          zip -qr ../../../../VoiceForge-iOS-simulator.zip VoiceForge.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: VoiceForge-iOS-simulator.zip
  publish:
    name: Publish GitHub release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python packages
        run: |
          pip install build
          python -m build
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_REF="${GITHUB_REF_NAME}"
          VERSION="${RAW_REF#release/}"
          VERSION="${VERSION#refs/tags/}"
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" \) -exec cp {} out/ \;
          cp dist/*.whl dist/*.tar.gz out/ 2>/dev/null || true
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoiceForge $VERSION" \
            --notes "VoiceForge $VERSION complete packaged release. Desktop apps for Windows, macOS and Linux; Android APK; iOS simulator build (unsigned); and Python wheel and source distribution. Everything runs CPU-only, low-RAM, and 100% offline." || gh release upload "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --clobber
