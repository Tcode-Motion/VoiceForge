name: Release apps
# Runs when a release branch is pushed (release/vX.Y.Z) or manually.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build app
        run: pyinstaller packaging/voiceforge.spec --noconfirm
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/VoiceForge.exe -DestinationPath VoiceForge-Windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qr ../VoiceForge-macOS.zip VoiceForge.app
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../VoiceForge-Linux.tar.gz VoiceForge
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            VoiceForge-Windows.zip
            VoiceForge-macOS.zip
            VoiceForge-Linux.tar.gz
          if-no-files-found: ignore
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    name: iOS app (unsigned, simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project VoiceForge.xcodeproj -scheme VoiceForge \
            -sdk iphonesimulator -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator
          zip -qr ../../../../VoiceForge-iOS-simulator.zip VoiceForge.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: VoiceForge-iOS-simulator.zip
  publish:
    name: Publish GitHub release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          mkdir -p out
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" \) -exec cp {} out/ \;
          gh release create "$VERSION" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "VoiceForge $VERSION" \
            --notes "First packaged release. Desktop apps for Windows, macOS and Linux; Android APK; iOS simulator build (unsigned, needs an Apple Developer account for devices). The studio package itself is in this repository: pip install . after bash scripts/setup_engines.sh"
